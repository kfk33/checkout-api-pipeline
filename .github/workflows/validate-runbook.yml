name: Validate Incident Runbook

on:
  push:
    branches:
      - main
    paths:
      - 'RUNBOOK-checkout-api-oom.md'
      - 'POSTMORTEM-checkout-api-oom.md'

  workflow_dispatch:
    inputs:
      runbook_file:
        description: "Path to the runbook file to validate"
        required: true
        default: "RUNBOOK-checkout-api-oom.md"

permissions:
  contents: read

jobs:
  validate-runbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate runbook structure
        run: |
          FILE="${{ github.event.inputs.runbook_file }}"
          test -f "$FILE" || { echo "::error::$FILE not found in this repository."; exit 1; }
          grep -qi "diagnos" "$FILE" || { echo "::error::No diagnosis section found in $FILE."; exit 1; }
          grep -qi "resolut" "$FILE" || { echo "::error::No resolution section found in $FILE."; exit 1; }
          grep -q "kubectl " "$FILE" || { echo "::error::No real kubectl command found in $FILE."; exit 1; }
          echo "$FILE has a diagnosis section, a resolution section, and at least one real kubectl command."
