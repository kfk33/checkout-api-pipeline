name: checkout-api CI

on:
  push:
    branches:
      - main
    paths:
      - '**'  # run CI on all changes
  workflow_dispatch:
    inputs:
      runbook_file:
        description: "Runbook file to validate"
        required: true
        default: "RUNBOOK-checkout-api-oom.md"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build checkout-api
        run: docker build -t checkout-api:ci .

      - name: Test checkout-api
        run: |
          docker run -d -p 8000:8000 --name checkout-api-test checkout-api:ci
          sleep 5
          curl -f http://localhost:8000/health
          docker rm -f checkout-api-test

  validate-runbook:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Select runbook file
        run: |
          if [ -z "${{ github.event.inputs.runbook_file }}" ]; then
            FILE="RUNBOOK-checkout-api-oom.md"
          else
            FILE="${{ github.event.inputs.runbook_file }}"
          fi
          echo "FILE=$FILE" >> $GITHUB_ENV

      - name: Validate runbook structure
        run: |
          test -f "$FILE" || { echo "::error::$FILE not found."; exit 1; }
          grep -qi "diagnos" "$FILE" || { echo "::error::No diagnosis section found."; exit 1; }
          grep -qi "resolut" "$FILE" || { echo "::error::No resolution section found."; exit 1; }
          grep -q "kubectl " "$FILE" || { echo "::error::No kubectl command found."; exit 1; }
          echo "$FILE is valid."

      - name: Validate scaling policy
        run: |
          test -f scaling-policy.yaml || { echo "scaling-policy.yaml is missing"; exit 1; }
          DEPLOYMENT_NAME=$(grep -A1 '^target:' scaling-policy.yaml | grep 'deployment:' | awk '{print $2}')
          test -n "$DEPLOYMENT_NAME" || { echo "target.deployment is missing"; exit 1; }
          grep -q "name: $DEPLOYMENT_NAME" checkout-api-deployment.yaml || {
            echo "scaling-policy.yaml targets '$DEPLOYMENT_NAME', which checkout-api-deployment.yaml does not define"
            exit 1
          }
          grep -q 'memory_mi:' scaling-policy.yaml || { echo "threshold.memory_mi is missing"; exit 1; }
          grep -q 'replicas:' scaling-policy.yaml || { echo "action.replicas is missing"; exit 1; }
          echo "scaling-policy.yaml is valid and targets a real Deployment"
